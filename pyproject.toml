[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-order-extractor"
version = "0.0.1"
description = "Turn unstructured order emails and PDFs into validated, structured order JSON using LLMs."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jahanzaib Ahmad" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "openai>=1.40",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/order_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
